<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendar 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calendar" aria-label="Calendar">
    <header class="header">
      <h1 id="month-year"></h1>
      <div class="nav">
        <button id="today-btn" class="chip" type="button">Today</button>
        <button id="prev" class="icon-btn" type="button" aria-label="Previous month">&#8249;</button>
        <button id="next" class="icon-btn" type="button" aria-label="Next month">&#8250;</button>
      </div>
    </header>

    <div class="weekdays" aria-hidden="true">
      <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
    </div>
    <div class="days" id="days"></div>
  </main>

  <dialog id="dialog" aria-labelledby="selected-date">
    <div class="dialog-head">
      <div>
        <p id="selected-weekday" class="weekday"></p>
        <h2 id="selected-date"></h2>
      </div>
      <button id="close" class="close" type="button" aria-label="Close">&times;</button>
    </div>

    <section id="list-view">
      <ul id="program-list" class="program-list"></ul>
      <button id="new-btn" class="primary" type="button">New program</button>
    </section>

    <form id="program-form" class="form" autocomplete="off" hidden>
      <label class="field">
        <span>Title</span>
        <input id="title" type="text" maxlength="60" placeholder="Team meeting" required>
      </label>
      <label class="field">
        <span>Time</span>
        <input id="time" type="time">
      </label>
      <fieldset class="colors">
        <legend>Color</legend>
        <label><input type="radio" name="color" value="#ff6b81" checked><span style="--c:#ff6b81"></span></label>
        <label><input type="radio" name="color" value="#ffb347"><span style="--c:#ffb347"></span></label>
        <label><input type="radio" name="color" value="#3ecfb2"><span style="--c:#3ecfb2"></span></label>
        <label><input type="radio" name="color" value="#8b7bff"><span style="--c:#8b7bff"></span></label>
      </fieldset>
      <button class="primary" type="submit">Save program</button>
    </form>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
